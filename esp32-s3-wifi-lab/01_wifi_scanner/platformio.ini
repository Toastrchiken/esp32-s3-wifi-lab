; Project 1 - WiFi scanner + RSSI logger (ESP32-S3-DevKitC-1)
; Official PlatformIO espressif32 platform (Arduino-ESP32 core 2.0.17).
;
; Two environments - pick one with the env selector in the bottom status bar:
;   uart : board plugged into the port labelled "COM"/"UART"  (default)
;   usb  : board plugged into the port labelled "USB" (native USB, no driver needed)

[platformio]
default_envs = uart

[env]
platform = espressif32 @ ^6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:uart]
; Serial goes out through the on-board USB-to-UART bridge chip (Arduino default).

[env:usb]
; Serial goes out through the ESP32-S3's own USB (USB-Serial/JTAG).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
