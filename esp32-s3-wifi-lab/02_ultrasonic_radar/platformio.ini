; Project 02 - Wi-Fi ultrasonic radar security scanner (ESP32-S3-DevKitC-1)
; Official PlatformIO espressif32 platform (Arduino-ESP32 core 2.0.17). No external libraries.
;
; Plug into the port labelled "UART" and use env:uart (default),
; or the port labelled "USB" and select env:usb in the bottom status bar.

[platformio]
default_envs = uart

[env]
platform = espressif32 @ ^6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; regenerates src/index_html.h from web/index.html before each build
extra_scripts = pre:tools/embed_html.py
; set these to your board's COM port if auto-detect picks the wrong one
; upload_port = COM4
; monitor_port = COM4

[env:uart]

[env:usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
